<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MBA ESALQ - Quiz</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="p-4 md:p-8 min-h-screen">

    <div class="max-w-5xl mx-auto">
        <!-- Cabeçalho -->
        <header class="mb-10 text-center md:text-left">
            <h1 class="text-4xl font-bold text-white mb-2" id="challenge-title">
                <i class="fa-solid fa-terminal text-emerald-500 mr-3"></i>
                QUIZ - MBA ESALQ
            </h1>
            <p class="text-slate-400 text-lg" id="challenge-desc">Carregando desafios...</p>

            <!-- Botão Libertar Passos -->
            <div class="mt-8">
                <button id="reveal-btn"
                    class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 px-8 rounded-full shadow-lg shadow-emerald-900/20 transition-all flex items-center mx-auto md:mx-0 group">
                    <i class="fa-solid fa-play-circle mr-2 group-hover:scale-110 transition-transform"></i>
                    Liberar passos
                </button>
            </div>
        </header>

        <!-- Navegação de Atividades -->
        <nav id="activities-nav" class="flex overflow-x-auto gap-4 mb-8 pb-4 border-b border-slate-700/50" style="scrollbar-width: thin; scrollbar-color: #475569 transparent;"></nav>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">

            <!-- Sidebar: Guia Rápido -->
            <aside class="space-y-6">
                <div class="glass-panel rounded-xl p-6 shadow-xl">
                    <h2 class="text-xl font-semibold mb-4 text-emerald-400 border-b border-slate-700 pb-2">
                        <i class="fa-solid fa-keyboard mr-2"></i>Guia do Vim
                    </h2>
                    <ul class="space-y-3 text-sm terminal-font">
                        <li class="flex justify-between"><span class="text-slate-400">Abrir:</span> <span
                                class="text-white font-bold">vim [arq]</span></li>
                        <li class="flex justify-between"><span class="text-slate-400">Modo Inserir:</span> <span
                                class="text-white font-bold">i</span></li>
                        <li class="flex justify-between"><span class="text-slate-400">Sair do Modo:</span> <span
                                class="text-white font-bold">Esc</span></li>
                        <li class="flex justify-between"><span class="text-slate-400">Guardar e Sair:</span> <span
                                class="text-emerald-400 font-bold">:wq</span></li>
                        <li class="flex justify-between"><span class="text-slate-400">Sair sem Guardar:</span> <span
                                class="text-red-400 font-bold">:q!</span></li>
                    </ul>
                </div>

                <div class="glass-panel rounded-xl p-6 shadow-xl">
                    <h2 class="text-xl font-semibold mb-4 text-emerald-400 border-b border-slate-700 pb-2">
                        <i class="fa-solid fa-lock mr-2"></i>Permissões
                    </h2>
                    <div class="grid grid-cols-2 gap-2 text-xs terminal-font">
                        <div class="bg-slate-800 p-2 rounded text-center">
                            <span class="block text-emerald-400 font-bold">4</span> Leitura (r)
                        </div>
                        <div class="bg-slate-800 p-2 rounded text-center">
                            <span class="block text-emerald-400 font-bold">2</span> Escrita (w)
                        </div>
                        <div class="bg-slate-800 p-2 rounded text-center">
                            <span class="block text-emerald-400 font-bold">1</span> Exec (x)
                        </div>
                        <div class="bg-slate-800 p-2 rounded text-center">
                            <span class="block text-emerald-400 font-bold">0</span> Nenhuma (-)
                        </div>
                    </div>
                </div>
            </aside>

            <!-- Conteúdo Principal -->
            <div class="lg:col-span-2 space-y-6" id="challenge-container">
                <!-- O conteúdo do desafio será injetado dinamicamente aqui -->
            </div>
        </div>
    </div>

    <!-- Toast de Cópia -->
    <div id="toast"
        class="fixed bottom-8 left-1/2 -translate-x-1/2 bg-slate-800 border border-emerald-500 px-6 py-3 rounded-full shadow-2xl opacity-0 transition-opacity pointer-events-none text-white z-50">
        Comando copiado para a área de transferência!
    </div>

    <!-- Lógica JavaScript -->
    <script type="module" src="js/main.js"></script>
</body>

</html>
